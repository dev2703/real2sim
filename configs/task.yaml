# Task geometry and physical parameters. Labels: see docs/calibration.md (D-012).
# Units: metres, kilograms, radians unless the key says otherwise. Transforms are T_parent_child.
provenance_default: PROVISIONAL-STANDARD

table:
  height: 0.737   # OPERATOR-MEASURED 29 in (2026-10-13); was 0.75 provisional
  mat: {size_xy: [0.305, 0.406], center_task_xy: [0.235, 0.044]}   # OPERATOR-MEASURED 12 x 16 in (2026-10-13); 12 in across the camera view (x), 16 in along it (y); centre fitted from the image

frames:
  T_task_so101base: {xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}

ball:
  radius: 0.0335
  mass: 0.058
  friction: {nominal: 0.6, sweep: [0.4, 0.9]}
  inertia: thin_shell
  restitution_nominal: 0.75
  start_region: {center_task_xy: [0.3557, 0.2047], radius: 0.03, provenance: "DATA-DERIVED v4 (2026-10-13): ball centroid of the first frame of episodes 0-7 back-projected through the operator-measured camera onto the ball-centre plane, n=8, std 1.0/1.6 cm; operator reports ~15 in from the table edge"}

bowl:
  # OPERATOR-SUPPLIED 2026-10-12 (image cross-check suggests ~12 cm outer diameter, ~5-6 cm height;
  # re-measure requested, see docs/calibration.md section 1)
  inner_rim_radius: 0.050
  inner_depth: 0.0254
  wall_thickness: 0.002
  outer_height: 0.030
  base_diameter: 0.060      # PROVISIONAL-STANDARD
  mass: 0.30                # PROVISIONAL-STANDARD
  static: true
  center_task_xy: [0.318, -0.035]   # DATA-DERIVED 2026-10-13: rim centre (hand-read px 840,475 in ep5 f0) back-projected through the operator-measured camera at outer_height; was [0.3300, -0.1687] from the superseded camera
  center_provenance: "DATA-DERIVED v4 (2026-10-13): rim centre hand-read at pixel (840,475) in episode 5 frame 0, back-projected through the operator-anchored camera at outer_height; supersedes the v3 in-bowl-ball estimate"
  collision: {wall_boxes: 20, base: cylinder}
  depth_sweep: [0.0254, 0.045, 0.060]

camera_iphone:
  key: observation.images.iphone
  width: 1280
  height: 720
  # 2026-10-13 operator-anchored fit: 0.305 x 0.406 m mat; camera 24 in horizontally from the
  # robot's nearest edge and 21 in above the table (operator uncertainty +/-3%). Orientation,
  # focal length, camera x and mat placement fitted from hand-read joints and mat corners.
  # Principal point fixed at image centre, square pixels, no distortion model. The earlier
  # free-position planar fit (fx ~2200) is superseded; see extrinsics_provenance for residuals.
  # Previous (superseded) values: fovy_deg 42.57, intrinsics fx=fy=924, approx_position_task [0.3285, -0.4444, 0.3852],
  # look_at_task [0.2096, -0.0138, -0.0029], xyaxes_task [0.97959, 0.15245, -0.13098, -0.00469, 0.66887, 0.74337].
  fovy_deg: 22.79
  intrinsics_px: {fx: 1786.0, fy: 1786.0, cx: 640.0, cy: 360.0}
  extrinsics_provenance: "OPERATOR-MEASURED position 2026-10-13 (24 in horizontally from the robot's nearest edge, 21 in above the table, +-3 %) with focal length, orientation, camera x and mat placement fitted to hand-read robot joint pixels and the mat outline (scripts/diag_camera_fit_measured.py; joints RMS 78 px dominated by wrist/tip readings, lift/elbow 48 px, mat 41 px). Supersedes the fx=924 fit."
  approx_position_task: [0.0905, -0.7043, 0.5214]
  look_at_task: [0.2292, 0.0609, 0.0116]
  xyaxes_task: [0.98589, -0.08109, 0.14642, -0.07603, 0.56236, 0.82339]   # MuJoCo xyaxes (x right, y up)

robot_so101:
  # D-014 APPROVED 2026-10-13: PROVISIONAL inferred base lift (real base origin above table top)
  base_z_offset: 0.012
  joint_names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
  real_to_sim: {sign: [1, 1, 1, 1, 1], offset_deg: [0, 0, 0, 0, 0], provenance: "PROVISIONAL-STANDARD; verify at M2"}
  gripper: {real_unit: percent, closed_at: 0, sim_range_rad: [-0.1745, 1.7454]}

episode:
  success_hold_s: 1.0
  timeout_s: 30.0
