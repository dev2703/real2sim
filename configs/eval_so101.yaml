# Closed-loop evaluation knobs for the SO-101 MuJoCo scene (plan M4.3-4). Success, timeout and
# geometry come from configs/task.yaml (episode.success_hold_s, episode.timeout_s); this file holds
# evaluation-only settings. Controller labels: LEARNED_ACT (checkpoint predictions), HOLD_POSE
# (null baseline that holds the initial pose; never a policy result).
task_config: configs/task.yaml

cartesian:
  max_step_m: 0.03          # per-tick translation clamp on the 7-D delta (plan section 3.3)
  max_step_rad: 0.3         # per-tick rotation clamp (rotation-vector norm)

phase:
  # Tool-site-to-ball-centre distance (ball radius 0.0335 m). A failed trial whose minimum distance
  # stays above this is 'approach', otherwise 'grasp'. Must equal the 3 cm stated in
  # docs/experiment_protocol.md section 3.
  approach_distance_m: 0.03

inference:
  device: cpu               # keep MPS free for training; override with --device

video:
  fps: 10                   # one frame per policy tick
  upscale: 2                # 256x192 policy view -> 512x384
  codec: mp4v
