# D-016: authorised augmentation/regularisation remedy; new run, original weights preserved.
name: act_cartesian_augmented
data: .cache/derived_cartesian
model:
  chunk_size: 20
  n_action_steps: 2
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  dropout: 0.2
  kl_weight: 10.0
  optimizer_lr: 1.0e-5
  optimizer_lr_backbone: 1.0e-5
  optimizer_weight_decay: 1.0e-3
augmentation:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.15
  shift_pixels: 4
train:
  seed: 0
  batch_size: 16
  grad_accum: 1
  steps: 6000
  grad_clip_norm: 10.0
  log_every: 50
  val_every: 1000
  save_every: 6000
  val_max_batches: null
  num_workers: 2
  device: mps
  early_stopping_patience: 3
  early_stopping_min_steps: 3000
  early_stopping_min_delta: 0.001
