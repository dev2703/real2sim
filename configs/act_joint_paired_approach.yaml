# D-020: warm-start a separate, mixed real/sim-image pilot; original weights frozen.
name: act_joint_paired_approach
data: .cache/derived_joint
initial_checkpoint: outputs/act_joint_so101/checkpoints/020000
paired_images:
  root: .cache/paired_approach_3988577/train
  probability: 0.5
model:
  chunk_size: 20
  n_action_steps: 2
  vision_backbone: resnet18
  pretrained_backbone_weights: null  # all model weights come from initial_checkpoint
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  optimizer_lr: 5.0e-6
  optimizer_lr_backbone: 5.0e-6
  optimizer_weight_decay: 1.0e-4
train:
  seed: 0
  batch_size: 16
  grad_accum: 1
  steps: 1000
  grad_clip_norm: 10.0
  log_every: 50
  val_every: 250
  save_every: 1000
  val_max_batches: null
  num_workers: 2
  device: mps
  keep_only_best_and_last: true
